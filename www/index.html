<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Escondite 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0e1a2b; --lamp: #ffc857; --ink: #eef3ea; --danger: #ff6b6b; --ok: #9be38f;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); }
  body {
    font-family: 'Sniglet', 'Trebuchet MS', system-ui, sans-serif; color: var(--ink);
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  #blind { position: fixed; inset: 0; background: #04060b; z-index: 1; display: none; }
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; pointer-events: none;
  }
  .hud[hidden] { display: none; }
  .pill { background: rgba(14,26,43,.8); border-radius: 999px; padding: 8px 14px; font-size: 15px; line-height: 1.2; }
  .pill b { font-size: 20px; }
  #role.seeker { color: var(--danger); } #role.hider { color: var(--ok); }
  #banner {
    position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 2;
    width: 90%; text-align: center; font-size: clamp(24px, 7vw, 40px); font-weight: 800;
    text-shadow: 0 2px 16px rgba(0,0,0,.8); pointer-events: none;
  }
  #banner small { display: block; font-size: 17px; font-weight: 400; margin-top: 8px; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; margin: 0 auto; max-width: 520px;
    background: rgba(14,26,43,.93); border-radius: 26px 26px 0 0;
    padding: 20px 22px calc(env(safe-area-inset-bottom, 0px) + 20px);
    text-align: center;
  }
  .sheet[hidden] { display: none; }
  h1 { margin: 0; font-size: clamp(44px, 13vw, 72px); line-height: .95; color: var(--lamp); }
  .sheet p { margin: 10px 0 16px; opacity: .88; font-size: 16px; line-height: 1.45; }
  .row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 14px; }
  input {
    font: inherit; font-size: 19px; text-align: center; color: var(--night); background: var(--ink);
    border: 0; border-radius: 14px; padding: 12px 14px; width: 60%; min-width: 0;
  }
  input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; }
  button {
    font: inherit; font-size: 19px; font-weight: 800; cursor: pointer;
    color: var(--night); background: var(--lamp); border: 0; border-radius: 999px; padding: 13px 30px;
  }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  button.ghost { background: transparent; color: var(--ink); border: 2px solid rgba(238,243,234,.4); }
  button.dice { padding: 12px 16px; font-size: 22px; background: rgba(238,243,234,.14); color: var(--ink); }
  .wide { width: 100%; }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; }
  #players { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #players li { background: rgba(238,243,234,.1); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
  #players .ok { color: var(--ok); margin-left: 4px; }
  #disguise {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; gap: 8px; overflow-x: auto; align-items: center;
    background: linear-gradient(transparent, rgba(14,26,43,.85) 35%);
  }
  #disguise[hidden] { display: none; }
  #disguise span { flex: none; font-size: 14px; opacity: .85; margin-right: 2px; }
  #disguise button {
    flex: none; font-size: 26px; line-height: 1; padding: 10px 11px; border-radius: 16px;
    background: rgba(14,26,43,.9); color: var(--ink); border: 2px solid rgba(238,243,234,.2);
  }
  #disguise button[aria-pressed="true"] { border-color: var(--lamp); background: rgba(255,200,87,.25); }
  #viewBtn { pointer-events: auto; font-size: 15px; font-weight: 400; color: var(--ink); cursor: pointer; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(238,243,234,.8); box-shadow: 0 0 0 2px rgba(14,26,43,.5); z-index: 2; pointer-events: none; display: none; }
  #hint { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 2; pointer-events: none;
    background: rgba(14,26,43,.85); border-radius: 18px; padding: 10px 18px; font-size: 15px; max-width: 88%; text-align: center;
    opacity: 0; transition: opacity .4s; }
  #disguise button.place { font-size: 16px; font-weight: 800; background: var(--lamp); color: var(--night); border-color: var(--lamp); padding: 12px 14px; }
  #disguise button.place:disabled { opacity: .45; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translateX(-50%); z-index: 2; pointer-events: none;
    font-size: 26px; font-weight: 800; color: var(--lamp); text-shadow: 0 2px 12px rgba(0,0,0,.8); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #jumpBtn { position: fixed; right: 18px; z-index: 3; width: 68px; height: 68px; padding: 0; border-radius: 50%;
    font-size: 30px; background: rgba(238,243,234,.2); color: var(--ink); border: 2px solid rgba(238,243,234,.45); }
  #jumpBtn[hidden], #stam[hidden] { display: none; }
  #stam { position: fixed; left: 50%; transform: translateX(-50%); width: 120px; height: 7px; border-radius: 4px;
    background: rgba(14,26,43,.7); z-index: 2; pointer-events: none; overflow: hidden; }
  #stam div { height: 100%; background: var(--ok); border-radius: 4px; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 5; background: var(--night); }
</style>
</head>
<body>
<div id="loading">Cargando el mundo…</div>
<div id="blind"></div>

<div class="hud" id="hud" hidden>
  <div class="pill" id="role"></div>
  <div class="pill" id="mapName"></div>
  <div class="pill" id="timer"></div>
  <button class="pill" id="viewBtn"></button>
</div>
<div id="banner"></div>
<div id="cross"></div>
<div id="toast"></div>
<button id="jumpBtn" aria-label="Saltar" hidden>⤒</button>
<div id="stam" hidden><div></div></div>
<div id="hint">Izquierda: moverte (a tope, correr)<br>Derecha: mirar · ⤒ saltar</div>
<div id="disguise" hidden></div>

<div class="sheet" id="welcome">
  <h1>Escondite 3D</h1>
  <p>Un jugador busca con su linterna. Los demás se esconden o se transforman en objetos.</p>
  <div class="row">
    <input id="nick" maxlength="12" autocomplete="off" placeholder="Tu nombre" aria-label="Tu nombre">
    <button class="dice" id="dice1" aria-label="Otro personaje">🎲</button>
  </div>
  <div class="row">
    <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="Código de sala" aria-label="Código de sala" style="text-transform:uppercase">
    <button class="dice" id="newCode" aria-label="Crear sala nueva">✨</button>
  </div>
  <p id="welcomeMsg" style="margin:0 0 12px;font-size:14px">Escribe el código de un amigo o pulsa ✨ para crear tu sala.</p>
  <button class="wide" id="enter">Entrar</button>
</div>

<div class="sheet" id="lobby" hidden>
  <h2>Sala de espera</h2>
  <p id="lobbyNote"></p>
  <ul id="players"></ul>
  <div class="row">
    <button class="dice" id="dice2" aria-label="Otro personaje">🎲</button>
    <button id="readyBtn" style="flex:1">Estoy listo</button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-auth-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  if (!window.THREE) { $('loading').textContent = 'No se pudo cargar el motor 3D. Recarga la página.'; return; }
  $('loading').remove();

  // ================= MAPAS =================
  function seg(x1, z1, x2, z2, h, c) { // pared recta de 0,4 m
    const t = .4;
    return x1 === x2 ? [x1, (z1 + z2) / 2, t, Math.abs(z2 - z1) + t, h, c] : [(x1 + x2) / 2, z1, Math.abs(x2 - x1) + t, t, h, c];
  }
  const border = (S, h, c) => [seg(0, 0, S, 0, h, c), seg(0, S, S, S, h, c), seg(0, 0, 0, S, h, c), seg(S, 0, S, S, h, c)];
  function containerW(x, z, rot, c, st) { return rot ? [x, z, 2.4, 6, 2.6 * st, c, 'container'] : [x, z, 6, 2.4, 2.6 * st, c, 'container']; }

  const HEDGE = '#2f5a3a';
  const MAPS = [
    {
      name: 'Parque nocturno', S: 40, ground: '#24452f', bg: '#0f1d2e', amb: .55, moon: .45,
      walls: [...border(40, 1.6, HEDGE),
        seg(6, 8, 14, 8, 1.6, HEDGE), seg(26, 6, 26, 14, 1.6, HEDGE), seg(14, 16, 24, 16, 1.6, HEDGE),
        seg(14, 24, 24, 24, 1.6, HEDGE), seg(6, 18, 6, 28, 1.6, HEDGE), seg(33, 20, 33, 30, 1.6, HEDGE),
        seg(10, 33, 18, 33, 1.6, HEDGE), seg(24, 32, 32, 32, 1.6, HEDGE), seg(30, 12, 36, 12, 1.6, HEDGE),
        seg(12, 10, 12, 14, 1.6, HEDGE),
        [22, 9, 2.2, .7, .6, '#6b4a2e', 'bench'], [9, 30, .7, 2.2, .6, '#6b4a2e', 'bench']],
      trees: [[22, 3], [36.5, 24], [15, 37], [9, 22], [30, 36.5], [3, 14]],
      spots: [[3, 3, 1.4, 'bush'], [17, 4, 1.4, 'bush'], [36.5, 3.5, 1, 'box'], [14.5, 11, 1, 'box'], [29, 18, 1.5, 'bush'],
        [10, 15, 1.4, 'bush'], [19.5, 20, 1.7, 'bush'], [3, 24, 1, 'box'], [12, 28, 1.4, 'bush'], [29, 28, 1, 'box'],
        [37, 37, 1.4, 'bush'], [6, 37, 1.4, 'bush'], [20, 36.5, 1.4, 'bush'], [30, 6, 1.4, 'bush'], [37, 16, 1, 'box']],
      lights: [[20, 12, '#ffc857'], [10, 30, '#ffc857'], [30, 24, '#ffc857']],
      spawn: [20, 28], props: ['papel', 'cubo', 'cono', 'balon', 'maceta', 'caja']
    },
    {
      name: 'Mansión', S: 36, ground: '#6b4a33', bg: '#1a1320', amb: .5, moon: .3, indoor: true,
      walls: [...border(36, 3, '#d9cbb0'),
        seg(0, 14, 10, 14, 3, '#d9cbb0'), seg(13, 14, 23, 14, 3, '#d9cbb0'), seg(26, 14, 36, 14, 3, '#d9cbb0'),
        seg(14, 0, 14, 6, 3, '#d9cbb0'), seg(14, 9, 14, 14, 3, '#d9cbb0'), seg(24, 0, 24, 5, 3, '#d9cbb0'), seg(24, 8, 24, 14, 3, '#d9cbb0'),
        seg(18, 14, 18, 20, 3, '#d9cbb0'), seg(18, 23, 18, 30, 3, '#d9cbb0'),
        seg(0, 24, 8, 24, 3, '#d9cbb0'), seg(11, 24, 18, 24, 3, '#d9cbb0'), seg(26, 24, 30, 24, 3, '#d9cbb0'), seg(33, 24, 36, 24, 3, '#d9cbb0'),
        [7, 7, 3, 1.6, .8, '#7a5230', 'table'], [30, 4, 4, 1.2, .9, '#8c2f39', 'sofa'], [5, 30, 2.4, 3.4, .7, '#e8e2d6', 'bed'],
        [30, 31, 3.4, 2.4, .7, '#e8e2d6', 'bed'], [27, 18, 2.5, 1.5, .8, '#7a5230', 'table'], [19, 3, 2.2, 1.4, 1.1, '#1b1b1b', 'piano'],
        [35, 19, 1.2, 5, 1, '#9aa4ad', 'counter']],
      trees: [],
      spots: [[1.2, 10, .9, 'wardrobe'], [22.6, 1.2, .9, 'wardrobe'], [4, 1, 1, 'curtain'], [34.6, 12.5, .9, 'wardrobe'],
        [1.4, 19, 1, 'box'], [16.4, 19, 1, 'box'], [9, 20, 1.1, 'plant'], [1.2, 34.6, .9, 'wardrobe'], [16.6, 34.6, .9, 'wardrobe'],
        [22, 34.9, 1, 'curtain'], [34.6, 34.6, 1, 'box'], [28, 27, 1.1, 'plant'], [34.6, 28, .9, 'wardrobe'], [20.5, 11, 1, 'box'],
        [10, 12.8, 1, 'curtain']],
      lights: [[7, 7, '#ffd9a0'], [27, 19, '#ffd9a0'], [10, 30, '#ffd9a0']],
      spawn: [21, 26], props: ['silla', 'lampara', 'maceta', 'jarron', 'papel', 'cubo', 'balon', 'caja']
    },
    {
      name: 'Puerto', S: 44, ground: '#5d6168', bg: '#101a26', amb: .5, moon: .5, water: true,
      walls: [...border(44, 1.2, '#8a4b2a'),
        containerW(8, 6, 0, '#b8392c', 1), containerW(16, 6, 0, '#2e7bb5', 2), containerW(30, 5, 0, '#2f9a5a', 1),
        containerW(38, 10, 1, '#c98518', 1), containerW(6, 16, 1, '#7d4aa0', 2), containerW(14, 16, 0, '#178f7c', 1),
        containerW(26, 15, 0, '#b8392c', 1), containerW(34, 20, 1, '#2e7bb5', 1), containerW(10, 26, 0, '#c98518', 1),
        containerW(20, 24, 1, '#2f9a5a', 2), containerW(28, 28, 0, '#7d4aa0', 1), containerW(38, 30, 1, '#b8392c', 2),
        containerW(6, 36, 0, '#2e7bb5', 1), containerW(16, 36, 0, '#178f7c', 1), containerW(30, 38, 0, '#c98518', 2)],
      trees: [],
      spots: [[22, 6, 1, 'box'], [2.5, 2.5, .8, 'barrel'], [41, 3, 1, 'box'], [20, 15.5, 1, 'box'], [30, 11, .8, 'barrel'],
        [41, 20, 1, 'box'], [3, 26, .8, 'barrel'], [14, 21, 1, 'box'], [25, 22, .8, 'barrel'], [33, 34, 1, 'box'],
        [41, 41, .8, 'barrel'], [22, 41, 1, 'box'], [10, 41, 1, 'box'], [24, 33, 1.4, 'container'], [10, 31, 1.4, 'container'],
        [40, 17, 1.4, 'container']],
      lights: [[16, 11, '#cfe3ff'], [30, 24, '#cfe3ff'], [12, 32, '#cfe3ff']],
      spawn: [22, 30], props: ['cono', 'neumatico', 'pale', 'barril', 'cubo', 'papel', 'caja']
    }
  ];

  // ================= MOTOR 3D =================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  document.body.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, 1, .05, 200);
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const hemi = new THREE.HemisphereLight('#b9c8ff', '#2b2b22', .55); scene.add(hemi);
  const moon = new THREE.DirectionalLight('#aebfff', .45); moon.position.set(12, 25, 8); scene.add(moon);
  const points = [0, 1, 2].map(() => { const p = new THREE.PointLight('#ffc857', 0, 16, 1.6); scene.add(p); return p; });
  const flash = new THREE.SpotLight('#fff3c4', 0, 18, .55, .5, 1.2); scene.add(flash); scene.add(flash.target);
  scene.fog = new THREE.Fog('#0f1d2e', 25, 70);

  const G = {
    box: new THREE.BoxGeometry(1, 1, 1),
    sph: new THREE.SphereGeometry(1, 14, 10),
    hemi: new THREE.SphereGeometry(1, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    cyl: new THREE.CylinderGeometry(1, 1, 1, 12),
    cone: new THREE.ConeGeometry(1, 1, 12),
    skirt: new THREE.CylinderGeometry(.5, 1, 1, 14),
    torus: new THREE.TorusGeometry(.04, .009, 6, 14),
    disc: new THREE.CircleGeometry(1, 20),
    dodec: new THREE.DodecahedronGeometry(1, 0),
    tire: new THREE.TorusGeometry(.32, .14, 8, 18)
  };
  const lam = c => new THREE.MeshLambertMaterial({ color: c });
  function add(parent, geo, mat, sx, sy, sz, x, y, z) {
    const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m;
  }

  // ---------- Mapa ----------
  let ceiling = null;
  const decoyGroup = new THREE.Group();
  const decoyMeshes = new Map();
  let map = null, mapIdx = -1, mapGroup = null, boxes = [], spotObjs = [], tallWalls = [];
  function disposeGroup(g) {
    g.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.dispose()); if (o.geometry && !Object.values(G).includes(o.geometry)) o.geometry.dispose(); });
  }
  function buildMap(i) {
    if (mapGroup) { scene.remove(mapGroup); disposeGroup(mapGroup); }
    mapIdx = i; map = MAPS[i]; ceiling = null;
    for (const d of decoyMeshes.values()) { decoyGroup.remove(d.g); disposeGroup(d.g); } decoyMeshes.clear();
    if (!decoyGroup.parent) scene.add(decoyGroup); mapGroup = new THREE.Group(); scene.add(mapGroup);
    boxes = []; spotObjs = []; tallWalls = [];
    const S = map.S;
    scene.background = new THREE.Color(map.bg);
    add(mapGroup, G.box, lam(map.ground), S + 60, .2, S + 60, S / 2, -.1, S / 2);
    if (map.water) {
      const w = add(mapGroup, G.box, new THREE.MeshLambertMaterial({ color: '#1d4e6e' }), S + 60, .1, 30, S / 2, -.3, S + 15.5);
      w.userData.water = true;
    }
    if (!map.indoor) { // senderos
      const path = lam(map.water ? '#6d7178' : '#4b5a3c');
      add(mapGroup, G.box, path, S - 4, .02, 2.4, S / 2, .01, S / 2 + 4);
      add(mapGroup, G.box, path, 2.4, .02, S - 4, S / 2 - 4, .01, S / 2);
    } else { // alfombras y techo
      ceiling = add(mapGroup, G.box, lam('#cfc3aa'), S, .1, S, S / 2, 3.05, S / 2);
      add(mapGroup, G.box, lam('#6e2a35'), 6, .02, 4, 7, .01, 7);
      add(mapGroup, G.box, lam('#2c4a6e'), 5, .02, 5, 27, .01, 30);
    }
    for (const w of map.walls) {
      const [x, z, sw, sd, h, c, kind] = w;
      const g = new THREE.Group(); g.position.set(x, 0, z); mapGroup.add(g);
      const mat = lam(c);
      if (kind === 'container') {
        add(g, G.box, mat, sw, h, sd, 0, h / 2, 0);
        const rib = lam(new THREE.Color(c).multiplyScalar(.75));
        const long = sw > sd;
        for (let k = -2; k <= 2; k++) add(g, G.box, rib, long ? .08 : sw + .04, h - .1, long ? sd + .04 : .08, long ? k * sw / 5 : 0, h / 2, long ? 0 : k * sd / 5);
      } else if (kind === 'bench') {
        add(g, G.box, mat, sw, .1, sd, 0, .45, 0);
        add(g, G.box, lam('#333'), .1, .45, .1, sw / 2 - .15 * (sw > sd), .22, sd / 2 - .15 * (sd > sw));
      } else if (kind === 'bed') {
        add(g, G.box, lam('#6b4a2e'), sw, .4, sd, 0, .2, 0);
        add(g, G.box, mat, sw - .1, .25, sd - .1, 0, .52, 0);
        add(g, G.box, lam('#fafafa'), sw * .7, .15, .5, 0, .7, -sd / 2 + .4);
      } else if (kind === 'sofa') {
        add(g, G.box, mat, sw, .45, sd, 0, .22, 0);
        add(g, G.box, mat, sw, .5, .3, 0, .6, -sd / 2 + .15);
      } else if (kind === 'table') {
        add(g, G.box, mat, sw, .08, sd, 0, h, 0);
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(g, G.box, mat, .08, h, .08, sx * (sw / 2 - .1), h / 2, sz * (sd / 2 - .1));
      } else if (kind === 'piano') {
        add(g, G.box, mat, sw, h, sd, 0, h / 2, 0);
        add(g, G.box, lam('#f2f2f2'), sw - .2, .05, .3, 0, h - .25, sd / 2 + .1);
      } else if (h >= 1.5 && c === HEDGE) {
        add(g, G.box, mat, sw, h, sd, 0, h / 2, 0);
        add(g, G.box, lam('#3b6e47'), sw + .1, .25, sd + .1, 0, h, 0);
      } else {
        add(g, G.box, mat, sw, h, sd, 0, h / 2, 0);
        if (map.indoor && h > 2) add(g, G.box, lam('#8a6f55'), sw + .02, .3, sd + .02, 0, .15, 0);
      }
      const bx = { minx: x - sw / 2, maxx: x + sw / 2, minz: z - sd / 2, maxz: z + sd / 2, h };
      boxes.push(bx);
      if (h >= 1.5) { const mats = []; g.traverse(o => { if (o.material) mats.push(o.material); }); tallWalls.push({ b: bx, mats, faded: false }); }
    }
    for (const [x, z] of map.trees) {
      const g = new THREE.Group(); g.position.set(x, 0, z); mapGroup.add(g);
      add(g, G.cyl, lam('#5a3d26'), .25, 2.2, .25, 0, 1.1, 0);
      add(g, G.cone, lam('#244f33'), 1.8, 2.6, 1.8, 0, 2.8, 0);

      for (const p of ps) {
        if (p.sameTab || !g.players.includes(p.peer) || (g.caught || []).includes(p.peer) || myTagged.includes(p.peer)) continue;
        if (typeof p.presence.x === 'number' && Math.hypot(p.presence.x - me.x, p.presence.z - me.z) < CATCH) {
          myTagged.push(p.peer); taggedRound = g.round;
          if (navigator.vibrate) try { navigator.vibrate(60); } catch {}
        }
      }
    }
    pushPresence(false);

    // otros jugadores
    const seekerView = role === 'seeker';
    const seen = new Set();
    for (const p of ps) {
      if (p.sameTab) continue;
      const pr = p.presence;
      if (typeof pr.x !== 'number' || typeof pr.z !== 'number') continue;
      seen.add(p.peer);
      const seed = (pr.a | 0) >>> 0;
      let o = others.get(p.peer);
      if (!o || o.seed !== seed) {
        if (o) { scene.remove(o.ch.root); o.ch.dispose(); }
        o = { seed, ch: makeCharacter(seed), x: pr.x, z: pr.z, y: +pr.y || 0, o: +pr.o || 0, sp: 0 };
        scene.add(o.ch.root); others.set(p.peer, o);
      }
      const px = o.x, pz = o.z;
      const kk = 1 - Math.exp(-dt * 14), ty = typeof pr.y === 'number' ? Math.max(0, Math.min(3, pr.y)) : 0;
      if (Math.hypot(pr.x - o.x, pr.z - o.z) > 6) { o.x = pr.x; o.z = pr.z; }
      o.x += (pr.x - o.x) * kk; o.z += (pr.z - o.z) * kk; o.y += (ty - o.y) * kk;
      let diff = (+pr.o || 0) - o.o; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); o.o += diff * Math.min(dt * 12, 1);
      o.sp += (Math.hypot(o.x - px, o.z - pz) / Math.max(dt, .001) - o.sp) * (1 - Math.exp(-dt * 8)); const sp = o.sp;
      const inGame = g.players && g.players.includes(p.peer);
      const caught = inGame && (g.caught || []).includes(p.peer);
      const isSk = (g.phase === 'hide' || g.phase === 'seek') && p.peer === g.seeker;
      const dist = Math.hypot(o.x - me.x, o.z - me.z);
      let vis = true, alpha = 1, showLabel = true;
      if (g.phase === 'hide' || g.phase === 'seek') {
        if (caught || !inGame) { if (seekerView) vis = false; alpha = .35; }
        else if (pr.h) { if (seekerView) { vis = dist < REVEAL; alpha = .5; } else alpha = .5; }
        if (seekerView && dist > 6) showLabel = false;
      }
      const playing = g.phase === 'hide' || g.phase === 'seek';
      const dis = PROPS[pr.d] && !caught && (!playing || inGame) && !isSk ? pr.d : '';
      o.ch.setDisguise(dis);
      if (dis && seekerView) showLabel = false;
      o.ch.root.visible = vis;
      o.ch.root.position.set(o.x, o.y, o.z); o.ch.root.rotation.y = o.o;
      o.ch.animate(sp, dt, isSk && g.phase === 'seek', o.y > .05 && ty > .05 && Math.abs(ty - o.y) > .01);
      o.ch.beam.visible = isSk && g.phase === 'seek';
      o.ch.setOpacity(alpha);
      o.ch.label.sprite.visible = showLabel;
      o.ch.label.set(String(pr.n || '').slice(0, 12), isSk ? '#ff6b6b' : '#eef3ea');
    }
    for (const [id, o] of others) if (!seen.has(id)) { scene.remove(o.ch.root); o.ch.dispose(); others.delete(id); }

    // señuelos de todos los jugadores
    const want = new Map();
    const playingNow = g.phase === 'hide' || g.phase === 'seek';
    for (const p of ps) {
      const list = p.sameTab ? myDecoys.map(q => [q.t, q.x, q.z, q.r]) : p.presence.dc;
      if (!Array.isArray(list)) continue;
      if (!p.sameTab && playingNow && !(g.players || []).includes(p.peer)) continue;
      list.slice(0, MAX_DECOYS).forEach((q, k) => {
        if (!Array.isArray(q) || !PROPS[q[0]] || typeof q[1] !== 'number' || typeof q[2] !== 'number') return;
        if (q[1] < 0 || q[1] > map.S || q[2] < 0 || q[2] > map.S) return;
        want.set((p.sameTab ? 'me' : p.peer) + ':' + k + ':' + q[0], q);
      });
    }
    for (const [k, d] of decoyMeshes) if (!want.has(k)) { decoyGroup.remove(d.g); disposeGroup(d.g); decoyMeshes.delete(k); }
    for (const [k, q] of want) {
      let d = decoyMeshes.get(k);
      if (!d) { d = { g: buildProp(q[0]) }; decoyGroup.add(d.g); decoyMeshes.set(k, d); }
      d.g.position.set(q[1], 0, q[2]); d.g.rotation.y = +q[3] || 0;
      const bk = g.round + ':' + k;
      d.g.visible = !(seekerView && busted.has(bk));
      if (seekerView && g.phase === 'seek' && !busted.has(bk) && !k.startsWith('me:') && Math.hypot(q[1] - me.x, q[2] - me.z) < CATCH) {
        busted.add(bk); toast('¡Era una copia falsa!');
        if (navigator.vibrate) try { navigator.vibrate([30, 40, 30]); } catch {}
      }
    }

    // escondite propio se vuelve transparente
    const mine = joined && (role === 'hider' || role === 'caught' || role === 'watch' || role === 'none') ? spotAt(me) : null;
    spotObjs.forEach(s => fadeSpot(s, s === mine));
    // paredes entre la cámara y el jugador se vuelven transparentes
    for (const w of tallWalls) {
      let on = false;
      if (joined && !fp) { const cx = me.x - Math.sin(me.o) * 2.5, cz = me.z - Math.cos(me.o) * 2.5; on = cx > w.b.minx - 1.2 && cx < w.b.maxx + 1.2 && cz > w.b.minz - 1.2 && cz < w.b.maxz + 1.2; }
      fadeSpot(w, on);
    }

    // luces según el rol
    const dark = seekerView && g.phase === 'seek';
    hemi.intensity = dark ? .05 : map.amb; moon.intensity = dark ? .03 : map.moon;
    points.forEach((p, k) => p.intensity = map.lights[k] ? (dark ? .7 : 1.1) : 0);
    flash.intensity = dark ? 2.6 : 0;
    const eye = me.y + (myDisguise ? .55 : 1.6) - landDip;
    const lookDir = new THREE.Vector3(Math.sin(me.o) * Math.cos(pitch), Math.sin(pitch), Math.cos(me.o) * Math.cos(pitch));
    flash.position.set(me.x, fp ? eye - .1 : 1.4, me.z);
    flash.target.position.set(me.x + lookDir.x * 6, flash.position.y + lookDir.y * 6 - (fp ? 0 : 1.2), me.z + lookDir.z * 6);
    scene.fog.color.set(dark ? '#020305' : map.bg);
    scene.fog.near = dark ? 3 : 25; scene.fog.far = dark ? 15 : 70;
    scene.background.set(dark ? '#020305' : map.bg);
    $('blind').style.display = seekerView && g.phase === 'hide' ? 'block' : 'none';

    // cámara
    const portrait = innerHeight > innerWidth;
    if (!joined) {
      camPos.lerp(new THREE.Vector3(me.x, 2, me.z + 4.8), Math.min(dt * 5, 1));
      camera.position.copy(camPos); camera.lookAt(me.x, portrait ? .2 : .6, me.z);
      myChar.root.rotation.y = Math.sin(now / 1500) * .5;
    } else if (fp) {
      const by = grounded && !myDisguise ? Math.abs(Math.sin(bob)) * .05 * Math.min(speed / 4, 1) - .02 * Math.min(speed / 4, 1) : 0;
      camera.position.set(me.x + Math.sin(me.o) * .12, eye + by, me.z + Math.cos(me.o) * .12);
      camPos.copy(camera.position);
      camera.lookAt(camera.position.x + lookDir.x, camera.position.y + lookDir.y, camera.position.z + lookDir.z);
    } else {
      let dist = portrait ? 5.5 : 4.5; const h = Math.max(.6, 2.4 - pitch * 1.5);
      for (let d = .3; d <= dist; d += .15) {
        const cx = me.x - Math.sin(me.o) * d, cz = me.z - Math.cos(me.o) * d, cy = 1.2 + (h - 1.2) * d / dist;
        if (cx < .3 || cz < .3 || cx > map.S - .3 || cz > map.S - .3 || boxes.some(b => b.h > cy && cx > b.minx - .25 && cx < b.maxx + .25 && cz > b.minz - .25 && cz < b.maxz + .25)) { dist = Math.max(.6, d - .3); break; }
      }
      const target = new THREE.Vector3(me.x - Math.sin(me.o) * dist, me.y + 1.2 + (h - 1.2) * Math.min(1, dist / 4.5), me.z - Math.cos(me.o) * dist);
      camPos.lerp(target, Math.min(dt * 10, 1));
      camera.position.copy(camPos); camera.lookAt(me.x, me.y + 1.1, me.z);
    }
    if (ceiling) ceiling.visible = joined && fp;
    camera.fov = (fp ? 70 : 55) + runBlend * 7; camera.updateProjectionMatrix();
    $('cross').style.display = joined && fp && !(seekerView && g.phase === 'hide') ? 'block' : 'none';

    renderer.render(scene, camera);
    if (joined) updateHud(g, role);
    placeControls();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
